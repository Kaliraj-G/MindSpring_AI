{% extends "base.html" %}{% block content %}<p class="eyebrow">ASK · LISTEN · LEARN</p><h1>AI Voice Teacher</h1><p class="muted">Type a question or use your microphone. The browser can read the teacher's reply aloud.</p><section class="panel chat-panel"><div id="chatLog" class="chat-log"><div class="bubble assistant">Hello! What would you like to learn today?</div></div><div class="chat-controls"><input id="teacherInput" placeholder="Ask any question..." onkeydown="if(event.key==='Enter')sendTeacher()"><button class="secondary" onclick="startListening()">🎙 Speak</button><button class="primary" onclick="sendTeacher()">Send</button></div><label class="check"><input type="checkbox" id="speakReplies" checked> Read teacher replies aloud</label><div id="teacherStatus" class="status"></div></section>{% endblock %}
