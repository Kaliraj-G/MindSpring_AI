<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindSpring AI</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="topbar"><a class="logo" href="{{url_for('dashboard')}}">✦ MindSpring <span>AI</span></a><nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('notes_page')}}">My Notes</a><a href="{{url_for('tests_page')}}">Mock Tests</a><a href="{{url_for('teacher_page')}}">Voice Teacher</a><a href="{{url_for('history_page')}}">Progress</a></nav><div class="userbox">{{session.get('username')}} · <a href="{{url_for('logout')}}">Log out</a></div></header><main class="wrap">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="notice">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='app.js')}}"></script>{% block scripts %}{% endblock %}</body></html>
