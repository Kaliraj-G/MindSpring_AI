{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">LEARN ANYTHING</p><h1>AI Note Studio</h1><p class="muted">Create and save notes on any topic.</p></div></div><section class="panel"><label>Topic or question</label><input id="noteTopic" placeholder="e.g. Java arrays, photosynthesis, database normalization"><label>Note style</label><select id="noteMode"><option>Simple Notes</option><option>Detailed Notes</option><option>Exam Preparation</option><option>Quick Revision</option></select><button class="primary" onclick="generateNotes()">Generate notes</button><div id="noteStatus" class="status"></div><article id="noteOutput" class="output"></article></section><h2 class="section-title">Your saved notes</h2><div class="panel">{% for n in notes %}<div class="row"><div><b>{{n.topic}}</b><small>{{n.mode}} · {{n.created_at}}</small></div><button class="secondary" onclick="openNote({{n.id}})">View</button></div>{% else %}<p class="muted">No saved notes yet.</p>{% endfor %}</div>{% endblock %}
