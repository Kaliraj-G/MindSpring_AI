{% extends "base.html" %}{% block content %}<p class="eyebrow">PRACTISE AND IMPROVE</p><h1>Interactive Mock Test</h1><p class="muted">Generate a quiz, choose an answer for every question, then submit to analyse your learning gaps.</p><section class="panel form-grid"><div><label>Subject</label><input id="testSubject" placeholder="e.g. Java"></div><div><label>Topic</label><input id="testTopic" placeholder="e.g. Arrays"></div><div><label>Difficulty</label><select id="testDifficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div><label>Number of questions</label><select id="testCount"><option>5</option><option>10</option><option>15</option></select></div><button class="primary" onclick="generateTest()">Generate interactive test</button></section><div id="testStatus" class="status"></div><section id="quizArea"></section><section id="resultArea"></section>{% endblock %}
